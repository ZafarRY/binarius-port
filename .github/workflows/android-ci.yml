name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: |
          dotnet restore src/Binarius.Android/Binarius.Android.csproj
          dotnet restore tests/Binarius.Core.SmokeTests/Binarius.Core.SmokeTests.csproj

      - name: Run core smoke tests
        run: dotnet run --project tests/Binarius.Core.SmokeTests/Binarius.Core.SmokeTests.csproj --configuration Release

      - name: Build ARM64 APK
        run: >-
          dotnet publish src/Binarius.Android/Binarius.Android.csproj
          --configuration Debug
          --framework net10.0-android
          --runtime android-arm64
          -p:AndroidPackageFormats=apk
          -p:EmbedAssembliesIntoApk=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Binarius-Mobile-Android-ARM64-Debug
          path: src/Binarius.Android/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 14
