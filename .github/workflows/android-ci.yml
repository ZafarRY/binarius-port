name: Binarius Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Binarius Android ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify submodules
        run: |
          test -f Modules/Darius/Nikki/Nikki.csproj
          test -f Modules/Endscript/Endscript/Endscript.csproj
          test -f Modules/CoreExtensions/CoreExtensions/CoreExtensions.csproj

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android

      - name: Restore projects
        run: |
          dotnet restore src/Binarius.Android/Binarius.Android.csproj
          dotnet restore tests/Binarius.Core.SmokeTests/Binarius.Core.SmokeTests.csproj

      - name: Run core smoke tests
        shell: bash
        run: |
          dotnet run \
            --project tests/Binarius.Core.SmokeTests/Binarius.Core.SmokeTests.csproj \
            --configuration Release 2>&1 | tee smoke.log

      - name: Compile check Nikki engine
        run: |
          dotnet build src/Binarius.Nikki/Binarius.Nikki.csproj \
            --configuration Release --nologo > nikki-build.log 2>&1 || true
          echo "== error counts by code"
          grep -oE "error CS[0-9]+" nikki-build.log | sort | uniq -c | sort -rn | head -20
          echo "== first unique errors"
          grep -E "error CS[0-9]+" nikki-build.log | sed 's#.*/Modules/##' | sort -u | head -60
          echo "== result"
          tail -3 nikki-build.log

      - name: Build Binarius APK
        shell: bash
        run: |
          dotnet publish src/Binarius.Android/Binarius.Android.csproj \
            --configuration Debug \
            --framework net10.0-android \
            --runtime android-arm64 \
            -p:AndroidPackageFormats=apk \
            -p:EmbedAssembliesIntoApk=true \
            -p:TreatWarningsAsErrors=false \
            -v:minimal -nologo 2>&1 | tee build.log

      # Laporan ringkas: jalan walau step sebelumnya gagal
      - name: Build report
        if: always()
        shell: bash
        run: |
          STRIP='s#/home/runner/work/[^/]*/[^/]*/##g'
          cat build.log nikki-build.log 2>/dev/null > all.log || true

          grep -E ' error [A-Za-z]+[0-9]+:' all.log | sed "$STRIP" | sort -u > errors.txt || true
          grep -E ' warning [A-Za-z]+[0-9]+:' all.log | sed "$STRIP" | sort -u > warnings.txt || true
          touch errors.txt warnings.txt

          {
            echo "BINARIUS BUILD REPORT"
            echo "Errors: $(wc -l < errors.txt)   Warnings (unique): $(wc -l < warnings.txt)"
            echo
            echo "== ERRORS"
            head -150 errors.txt
            echo
            echo "== WARNINGS BY CODE (jumlah)"
            sed -E 's/.*warning ([A-Za-z]+[0-9]+):.*/\1/' warnings.txt | sort | uniq -c | sort -rn | head -30
            echo
            echo "== SMOKE TESTS (akhir log)"
            tail -20 smoke.log 2>/dev/null || true
          } > build-report.txt

          {
            echo '```'
            cat build-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: build-report.txt
          archive: false
          if-no-files-found: ignore
          retention-days: 14

      # Pilih tepat satu APK (utamakan yang -Signed, karena itu yang bisa diinstall)
      - name: Pick single APK
        run: |
          mkdir -p dist
          APK=$(find src/Binarius.Android/bin -name '*-Signed.apk' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find src/Binarius.Android/bin -name '*.apk' | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan" >&2
            find src/Binarius.Android/bin -type f | head -50
            exit 1
          fi
          echo "Memakai: $APK"
          cp "$APK" dist/Binarius-Android-ARM64-Debug.apk

      # v7 + archive:false = .apk diunggah langsung, tanpa zip
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/Binarius-Android-ARM64-Debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14